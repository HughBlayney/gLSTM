program: main.py
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --cfg
  - configs/GNN-xLSTM/peptides-func-GNN-xLSTM.yaml
  - wandb.use
  - True
  - gnn.shared
  - False
  - wandb.sweep_hacks
  - True
  - ${args_no_hyphens}
  - optim.early_stopping_patience
  - 40
  - out_dir
  - sweeps/results

method: bayes
metric:
  name: best/val_ap
  goal: maximize

parameters:
  xlstm.memory_dim:
    values: [8, 16, 32]
  xlstm.num_heads:
    max: 8
    min: 1
    distribution: int_uniform
  gnn.layers_mp:
    max: 50
    min: 10
    distribution: int_uniform
  gnn.act:
    values: [gelu, relu, none]

early_terminate:
  type: hyperband
  s: 2
  eta: 3
  max_iter: 108