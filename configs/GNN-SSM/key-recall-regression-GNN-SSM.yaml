out_dir: results/key_recall_regression
metric_best: mse
metric_agg: argmin
wandb:
  use: False
  project: key-recall
dataset:
  format: custom
  name: key-recall-regression
  task: graph
  task_type: regression
  transductive: False
  node_encoder: True
  node_encoder_name: LinearNode
  edge_encoder: False
  node_encoder_bn: False
key_recall:
  num_key_nodes: 8
  value_dimension: 16
  num_train_graphs: 8000
  num_val_graphs: 1000
  num_test_graphs: 1000
train:
  mode: custom
  batch_size: 64
  eval_period: 1
  ckpt_best: True
  ckpt_clean: True
model:
  type: gnn_ssm
  loss_fun: mse
  graph_pooling: add
gnn:
  head: ring-transfer
  dim_inner: 32
  layers_mp: 2
  layers_post_mp: 1
  batchnorm: False
  shared: False
  use_k_hop_aggregation: True
ssm:
  message_passing_activation_function: relu
  use_state_matrix: True
  use_input_matrix: True
  state_gating: False
  input_gating: False
  shared_state: True
  shared_input: True
  shared_gating: True
  dyn: True
  state_eigenvalue_magnitude: 1.0
  input_eigenvalue_magnitude: None
  train_state: False
  train_input: False
  conv_func: GCN
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.001
  max_epoch: 200
  early_stopping_loss_threshold: 0.001
  early_stopping_patience: 50