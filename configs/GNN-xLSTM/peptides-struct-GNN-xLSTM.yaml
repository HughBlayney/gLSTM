out_dir: results/lrgb
metric_best: mae
metric_agg: argmin
wandb:
  use: True
  project: peptides-struct
dataset:
  format: OGB
  name: peptides-structural
  task: graph
  task_type: regression
  transductive: False
  node_encoder: True
  node_encoder_name: Atom+LapPE
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: Bond
  edge_encoder_bn: False
posenc_LapPE:
  enable: True
  eigen:
    laplacian_norm: none
    eigvec_norm: L2
    max_freqs: 10
  model: DeepSet
  dim_pe: 16
  layers: 2
  raw_norm_type: none
train:
  mode: custom
  batch_size: 64
  eval_period: 1
  ckpt_best: True
  ckpt_clean: True
  parameter_limit: 500000
  dependent_parameter: gnn.dim_inner
model:
  type: gnn_xlstm
  loss_fun: l1
  graph_pooling: mean
gnn:
  dim_inner: 512
  layers_mp: 23
  layers_post_mp: 1
  batchnorm: False
  act: relu
  shared: False
  use_k_hop_aggregation: True
xlstm:
  num_blocks: 1
  num_heads: 5
  memory_dim: 16
  aggr: add
  input_norm_type: layer # careful - this cannot be group
  hidden_norm_type: group
  input_gate_type: ego
  dropout: None
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.001
  max_epoch: 1500
  scheduler: reduce_on_plateau
  num_warmup_epochs: 5
  reduce_factor: 0.5
  schedule_patience: 20
  min_lr: 1e-5
  early_stopping_patience: 100