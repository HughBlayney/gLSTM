---
out_dir: results
metric_best: accuracy
wandb:
  use: false
  project: ogbn-products
dataset:
  format: OGB
  name: ogbn-products
  task: node
  task_type: classification # Double check this
  transductive: true
  node_encoder: true
  node_encoder_name: LinearNode
  node_encoder_bn: false
  edge_encoder: false
  edge_encoder_bn: false
train:
  mode: custom
  sampler: random_node # Make sure to check random_node too, which I think is what baselines paper uses
  num_parts: 10
  neighbor_sizes:
    - 32
    - 24
    - 16
    - 8
    - 4
    - 4
    - 4
    - 4
    - 4
    - 4
  batch_size: 16
  eval_period: 5
  ckpt_period: 100
val:
  sampler: full_batch
  num_parts: 5
  #accelerator: cpu  # prevent GPU OOM during evaluation
model:
  type: gnn_xlstm
  loss_fun: cross_entropy
  graph_pooling: mean
gnn:
  layers_mp: 5
  layers_post_mp: 1
  dim_inner: 256
  act: relu
  use_k_hop_aggregation: False
  force_sparse_tensors: True
xlstm:
  num_blocks: 1
  num_heads: 1
  memory_dim: 16
  aggr: add
  input_norm_type: layer # careful - this cannot be group
  hidden_norm_type: group
  input_gate_type: ego
  use_forget_gate: False
  dropout: 0.5
optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-05
  base_lr: 0.003
  max_epoch: 300
  scheduler: cosine_with_warmup
  num_warmup_epochs: 5